[project]
name = "methylation_research"
version = "0.1.0"
description = "methylation_research using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.100.1,<1.0.0"
]

[project.scripts]
methylation_research = "methylation_research.main:run"
run_crew = "methylation_research.main:run"
train = "methylation_research.main:train"
replay = "methylation_research.main:replay"
test = "methylation_research.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
