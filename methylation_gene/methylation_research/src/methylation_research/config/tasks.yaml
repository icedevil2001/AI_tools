research_task:
  description: >
    Conduct a thorough research about {topic}
    Make sure you find any interesting and relevant information given
    the current year is {current_year}.
  expected_output: >
    A list with 10 bullet points of the most relevant information about {topic}
  agent: researcher

reporting_task:
  description: >
    Review the context you got and expand each topic into a full section for a report.
    Make sure the report is detailed and contains any and all relevant information.
  expected_output: >
    A fully fledged report with the main topics, each with a full section of information.
    Formatted as markdown without '```'
  agent: reporting_analyst

data_formatter_task:
  description: >
    Prepare and format {topic} in json format.
    You are responsible for preparing and formatting {topic} data in json format with following fields:

      "Gene_name": "The name of the gene",
      "methylation_status": "Hypermethylated or Hypomethylated",
      "phenotype": "Phenotypic description related to methylation",
      "gene_function": "Function of the gene in the cell",
      "role_in_cancer": "Role of the gene in cancer",
      "Disease": "Associated disease(s)",
      "url": "URL of the source",

  expected_output: >
    A json file with the formatted data.
  agent: data_formatter