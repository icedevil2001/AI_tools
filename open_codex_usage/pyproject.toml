[project]
name = "codex-usage-collector"
version = "0.1.0"
description = "Collect and aggregate Codex session usage over SSH"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "loguru>=0.7,<1",
    "pandas>=2.2,<3",
    "paramiko>=3.5,<4",
    "pyarrow>=18,<19",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pandas-stubs>=2.2.3.250308,<3",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
    "types-paramiko>=3.5.0.20240928,<4",
    "types-pyyaml>=6.0.12.20240917,<7",
]

[project.scripts]
codex-usage = "codex_usage_collector.main:cli"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_usage_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["codex_usage_collector"]
