[project]
name = "transcriber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "google-genai>=1.9.0",
    "moviepy>=2.1.2",
    "pydub>=0.25.1",
    "python-dotenv>=1.1.0",
    "werkzeug>=3.1.3",
    "flask-session>=0.5.0",
    "pymongo>=4.11.3",
    "click>=8.1.8",
]

[tool.uv]
# moviepy caps pillow<12, which pins a version with many known CVEs; we only use
# moviepy's audio extraction, not its PIL-based image/text clips.
override-dependencies = ["pillow>=13.0.0"]
