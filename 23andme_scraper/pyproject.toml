[project]
name = "23andme-scraper"
version = "0.1.0"
description = "Interactive Playwright scraper for 23andMe raw data exports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "loguru>=0.7.3",
    "playwright>=1.52.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twentythreeandme_scraper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
23andme-scraper = "twentythreeandme_scraper.main:cli"
